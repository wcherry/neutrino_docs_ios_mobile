name: NeutrinoDocs
packages:
  swift-sodium:
    url: https://github.com/jedisct1/swift-sodium
    from: "0.9.1"
  swift-markdown:
    url: https://github.com/swiftlang/swift-markdown
    from: "0.8.0"
options:
  bundleIdPrefix: com.neutrino
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16"

targets:
  NeutrinoDocs:
    type: application
    platform: iOS
    sources:
      - path: NeutrinoDocs
    dependencies:
      - package: swift-sodium
        product: Sodium
      - package: swift-markdown
        product: Markdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neutrino.docs
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "9"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        DEVELOPMENT_TEAM: "46KWJJ63FU"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: NeutrinoDocs/NeutrinoDocs.entitlements
      properties:
        # Universal Links: `https://www.getneutrino.app/open/doc/<file id>` opens a document here
        # instead of in Safari. Both host spellings are claimed so a link pasted without the
        # "www." still resolves. Which *paths* reach this app is decided by the
        # apple-app-site-association document served from the domain — see
        # `deploy/apple-app-site-association` in the Drive repository — not by this list.
        com.apple.developer.associated-domains:
          - applinks:www.getneutrino.app
          - applinks:getneutrino.app
    info:
      path: NeutrinoDocs/Info.plist
      properties:
        CFBundleName: Neutrino Docs
        CFBundleDisplayName: Neutrino Docs
        # Without these, xcodegen writes literal "1.0"/"1" into Info.plist and the
        # MARKETING_VERSION / CURRENT_PROJECT_VERSION build settings are ignored.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # actool writes only the *nested* CFBundleIcons > CFBundlePrimaryIcon >
        # CFBundleIconName. The top-level key is normally added by Xcode's
        # Info.plist generation, which this target doesn't use (it has an
        # explicit Info.plist), so declare it here — App Store Connect rejects
        # the upload with error 90713 without it.
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSFaceIDUsageDescription: "Neutrino Docs uses Face ID to unlock your end-to-end encrypted documents."
        NSCameraUsageDescription: "Neutrino Docs needs camera access to scan the QR code that carries your encryption key."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Phase 1 "Background upload / Background download" — see BackgroundSyncService.
        BGTaskSchedulerPermittedIdentifiers:
          - com.neutrino.docs.sync
        UIBackgroundModes:
          - fetch
          - processing
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Neutrino Docs Key File
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.json
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.neutrino.docs.keyfile
            UTTypeConformsTo:
              - public.json
            UTTypeDescription: Neutrino Docs Key File
            UTTypeTagSpecification:
              public.filename-extension:
                - json

  NeutrinoDocsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NeutrinoDocsTests
    dependencies:
      - target: NeutrinoDocs
    settings:
      base:
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: minimal
